name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimum : lire le code, publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'interrompt pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types, le lint et les traductions
        run: |
          npm run typecheck
          npm run lint
          npm run check:i18n
          npm run gen:sql -- --check

      - name: Construire la version web
        env:
          # Le site est servi sous https://<utilisateur>.github.io/<dépôt>/
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          # Système d'amis (facultatif). Valeurs PUBLIQUES, réglées dans
          # Settings → Secrets and variables → Actions → onglet « Variables ».
          # Ne jamais y mettre la clé secrète (sb_secret_… / service_role) : le build échouerait.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
